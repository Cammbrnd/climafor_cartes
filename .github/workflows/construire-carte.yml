# Construire la carte — calcule les indicateurs de chaque maille SAFRAN, puis publie
# les fichiers sur GitHub Pages (https://<compte>.github.io/<depot>/).
#
# A LANCER A LA MAIN la premiere fois (Actions > Construire la carte > Run workflow),
# APRES avoir lu « Avant le premier calcul » dans le README.
#
# SOURCE « sim » (recommandee) : les fichiers annuels en masse de Meteo-France (SIM
# quotidienne, Licence Ouverte), la source meme de GeoSAS. ~68 telechargements de ~140 Mo
# par fragment, AUCUNE requete a GeoSAS (hors une lecture de metadonnees), grille native
# exacte (9 892 mailles). SOURCE « position » : une requete par maille et par annee sur
# GeoSAS (~660 000 requetes : a eviter). SOURCE « demo » : donnees FICTIVES pour tester la
# chaine ; elle ne publie JAMAIS sur Pages (le jeu reste en artefact, 7 jours).
#
# Le calcul est reparti en FRAGMENTS (un job chacun, 6 h maximum par job) puis assemble.
#
# STATIONS (v2.1). Dans le meme calcul, les indicateurs annuels des stations Meteo-France sont
# precalcules (outils/stations_cli.R) et publies A COTE des mailles : stations.json et
# s_<grandeur>.bin.gz, dans le meme site. Un site Pages se REMPLACE en entier a chaque
# publication : c'est pourquoi les stations se construisent ici, et non dans un calcul a part
# qui effacerait les mailles (ou l'inverse). Source « mf » : les fichiers departementaux de
# Meteo-France (data.gouv.fr), les memes que l'analyse d'une station. Source « demo » : des
# stations FICTIVES, comme les mailles fictives, jamais publiees sur Pages.
name: Construire la carte

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source des series journalieres (sim = fichiers Meteo-France ; position = GeoSAS, a eviter)"
        type: choice
        options: [sim, position, demo]
        default: sim
      mailles:
        description: "sim = grille native Meteo-France | CSV lon,lat[,lambx,lamby] (ex. donnees_grille/mailles_safran.csv) | demo:<pas_km>"
        default: sim
      annee_debut:
        description: "Premiere annee"
        default: "1959"
      annee_fin:
        description: "Derniere annee (vide = annee precedente)"
        default: ""
      fragments:
        description: "Nombre de fragments (jobs). sim : 3 (chacun lit les ~68 fichiers annuels ; ~3,6 Go de memoire). position : 20"
        default: "3"
      en_parallele:
        description: "Fragments simultanes (3 pour sim ; 4 au plus pour position, qui menage GeoSAS)"
        default: "3"
      stations:
        description: "Precalculer aussi les stations Meteo-France (oui/non). Non : le site publie n'aura pas de stations."
        type: choice
        options: ["oui", "non"]
        default: "oui"
      stations_fragments:
        description: "Nombre de fragments pour les stations (jobs). Chacun lit les fichiers d'environ 25 departements."
        default: "4"
      base:
        description: "Calculer aussi la base du bilan (mode rapide) pour les mailles et pour les stations (oui/non). Non : le site publie n'aura pas de mode rapide."
        type: choice
        options: ["oui", "non"]
        default: "oui"

# Un seul calcul a la fois : deux calculs simultanes doubleraient la charge sur les serveurs
# de donnees (Meteo-France ou GeoSAS).
concurrency:
  group: construire-carte
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preparer:
    runs-on: ubuntu-24.04
    outputs:
      fragments: ${{ steps.liste.outputs.fragments }}
    steps:
      - id: liste
        env:
          N: ${{ inputs.fragments }}
        run: |
          if ! [[ "$N" =~ ^[0-9]+$ ]] || [ "$N" -lt 1 ] || [ "$N" -gt 256 ]; then
            echo "fragments doit etre un entier entre 1 et 256 (recu : $N)"; exit 1
          fi
          echo "fragments=$(seq -s, 1 "$N" | sed 's/^/[/; s/$/]/')" >> "$GITHUB_OUTPUT"

  fragment:
    needs: preparer
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.en_parallele) }}
      matrix:
        fragment: ${{ fromJSON(needs.preparer.outputs.fragments) }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Lecture rapide des fichiers SIM (la source « sim » se rabat sinon sur read.csv, ~10x plus lent).
          extra-packages: any::data.table

      - name: Calculer le fragment
        env:
          SOURCE: ${{ inputs.source }}
          MAILLES: ${{ inputs.mailles }}
          DEBUT: ${{ inputs.annee_debut }}
          FIN: ${{ inputs.annee_fin }}
          NF: ${{ inputs.fragments }}
          BASE: ${{ inputs.base }}
        run: |
          Rscript outils/carte_cli.R fragment source="$SOURCE" mailles="$MAILLES" \
            annee_debut="$DEBUT" annee_fin="$FIN" base="$BASE" \
            fragment=${{ matrix.fragment }} fragments="$NF" sortie=parts

      - uses: actions/upload-artifact@v4
        with:
          name: fragment-${{ matrix.fragment }}
          path: parts/
          retention-days: 3

  stations_preparer:
    if: ${{ inputs.stations == 'oui' }}
    runs-on: ubuntu-24.04
    outputs:
      fragments: ${{ steps.liste.outputs.fragments }}
    steps:
      - id: liste
        env:
          N: ${{ inputs.stations_fragments }}
        run: |
          if ! [[ "$N" =~ ^[0-9]+$ ]] || [ "$N" -lt 1 ] || [ "$N" -gt 96 ]; then
            echo "stations_fragments doit etre un entier entre 1 et 96 (recu : $N)"; exit 1
          fi
          echo "fragments=$(seq -s, 1 "$N" | sed 's/^/[/; s/$/]/')" >> "$GITHUB_OUTPUT"

  stations_fragment:
    needs: stations_preparer
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 2     # les fichiers de Meteo-France sont servis par un hebergeur tiers : on le menage
      matrix:
        fragment: ${{ fromJSON(needs.stations_preparer.outputs.fragments) }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2

      - name: Calculer les stations du fragment
        env:
          SOURCE: ${{ inputs.source }}
          DEBUT: ${{ inputs.annee_debut }}
          FIN: ${{ inputs.annee_fin }}
          NF: ${{ inputs.stations_fragments }}
          BASE: ${{ inputs.base }}
        run: |
          if [ "$SOURCE" = "demo" ]; then SRC=demo; else SRC=mf; fi
          Rscript outils/stations_cli.R fragment source="$SRC" \
            annee_debut="$DEBUT" annee_fin="$FIN" base="$BASE" \
            fragment=${{ matrix.fragment }} fragments="$NF" sortie=parts_stations

      - uses: actions/upload-artifact@v4
        with:
          name: stations-fragment-${{ matrix.fragment }}
          path: parts_stations/
          retention-days: 3

  assembler:
    needs: [fragment, stations_fragment]
    # Les stations sont facultatives (entree « stations = non » : le job est alors ignore), mais
    # si elles sont demandees et echouent, RIEN n'est publie : un site sans stations remplacerait
    # le precedent, et l'application perdrait la comparaison station / maille jusqu'au calcul suivant.
    if: ${{ !cancelled() && needs.fragment.result == 'success' && (needs.stations_fragment.result == 'success' || needs.stations_fragment.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2

      - uses: actions/download-artifact@v4
        with:
          pattern: fragment-*
          merge-multiple: true
          path: parts

      - if: ${{ inputs.stations == 'oui' }}
        uses: actions/download-artifact@v4
        with:
          pattern: stations-fragment-*
          merge-multiple: true
          path: parts_stations

      - name: Assembler et verifier
        env:
          SOURCE: ${{ inputs.source }}
          MAILLES: ${{ inputs.mailles }}
          DEBUT: ${{ inputs.annee_debut }}
          FIN: ${{ inputs.annee_fin }}
          STATIONS: ${{ inputs.stations }}
          BASE: ${{ inputs.base }}
        run: |
          if [ "$SOURCE" = "demo" ]; then
            TEXTE="DONNEES FICTIVES (jeu de démonstration, pas du climat)"
          elif [ "$SOURCE" = "sim" ]; then
            TEXTE="Météo-France, SIM quotidienne (SAFRAN-ISBA-MODCOU), Licence Ouverte 2.0"
          else
            TEXTE="Réanalyse SAFRAN-ISBA (Météo-France), via GeoSAS INRAE"
          fi
          Rscript outils/carte_cli.R assembler source_texte="$TEXTE" mailles="$MAILLES" \
            annee_debut="$DEBUT" annee_fin="$FIN" base="$BASE" parts=parts sortie=public
          Rscript outils/carte_cli.R verifier dossier=public
          if [ "$STATIONS" = "oui" ]; then
            if [ "$SOURCE" = "demo" ]; then
              TEXTE_ST="DONNEES FICTIVES (jeu de démonstration, pas du climat)"; NMIN=1
            else
              TEXTE_ST="Météo-France, données climatologiques de base quotidiennes (stations), Licence Ouverte 2.0"; NMIN=300
            fi
            Rscript outils/stations_cli.R assembler source_texte="$TEXTE_ST" \
              annee_debut="$DEBUT" annee_fin="$FIN" base="$BASE" parts=parts_stations sortie=public n_min=$NMIN
            Rscript outils/stations_cli.R verifier dossier=public
          fi
          touch public/.nojekyll
          {
            echo "# Carte ClimaFor"
            echo "Fichiers de donnees de l'onglet Carte de ClimaFor (aucune page a consulter ici)."
          } > public/index.md

      - if: ${{ inputs.source == 'demo' }}
        uses: actions/upload-artifact@v4
        with:
          name: jeu-demo-FICTIF
          path: public/
          retention-days: 7

      - if: ${{ inputs.source != 'demo' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  publier:
    # Jamais pour la source « demo » : des donnees fictives ne vont pas sur l'adresse publique.
    if: ${{ inputs.source != 'demo' }}
    needs: assembler
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verifier ce que verra le navigateur (CORS, compression)
        continue-on-error: true
        run: |
          URL="${{ steps.deployment.outputs.page_url }}meta.json"
          {
            echo "### En-tetes de $URL"
            echo '```'
            curl -sSI -H "Origin: https://exemple.test" -H "Accept-Encoding: gzip" "$URL" | grep -iE '^(HTTP|access-control|content-type|content-encoding|cache-control)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
