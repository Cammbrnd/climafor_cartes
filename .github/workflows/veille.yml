# Veille — une fois par mois : une nouvelle annee complete est-elle disponible dans
# SAFRAN ? Si oui (et seulement si un premier jeu a deja ete publie), relance la
# construction de la carte.
#
# Ce workflow ne lance JAMAIS le premier calcul complet : c'est une decision humaine.
name: Veille

on:
  schedule:
    - cron: "23 6 12 * *"      # le 12 de chaque mois, 6 h 23 UTC (pas a l'heure pile : moins de retard)
  workflow_dispatch:

permissions:
  contents: read
  actions: write               # relancer « Construire la carte » et garder ce workflow actif

jobs:
  veille:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2

      - name: Comparer le jeu publie et SAFRAN
        id: veille
        run: |
          Rscript outils/carte_veille.R url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - name: Relancer la construction
        if: ${{ steps.veille.outputs.declencher == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run construire-carte.yml --repo "${{ github.repository }}" -f source=sim

      # GitHub desactive les workflows planifies d'un depot public sans activite depuis
      # 60 jours. On demande a se reactiver soi-meme ; si cela ne suffit pas, GitHub
      # previent le proprietaire du depot par courriel (a verifier au premier hiver).
      - name: Rester actif
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/veille.yml/enable"
