# Verifier la publication — a lancer a la main apres « Construire la carte ».
#
# Lit les fichiers sur l'adresse PUBLIQUE de GitHub Pages, comme le ferait un navigateur
# d'un autre site : statut, en-tetes CORS, compression, taille, et coherence de meta.json
# avec grille.json et les fichiers de couches. Ne modifie rien. Le resultat est dans le
# journal du job.
name: Verifier la publication

on:
  workflow_dispatch:
    inputs:
      adresse:
        description: "Adresse de base (vide = https://<compte>.github.io/<depot>/)"
        default: ""

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Lire l'adresse publique
        env:
          ADRESSE: ${{ inputs.adresse }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          if [ -z "$ADRESSE" ]; then
            OWNER="${REPO%%/*}"; NOM="${REPO##*/}"
            ADRESSE="https://${OWNER,,}.github.io/${NOM}/"
          fi
          case "$ADRESSE" in */) ;; *) ADRESSE="$ADRESSE/";; esac
          echo "Adresse : $ADRESSE"
          echo "== En-tetes de meta.json (Origin: https://exemple.test) =="
          curl -sSI -H "Origin: https://exemple.test" -H "Accept-Encoding: gzip" "${ADRESSE}meta.json" \
            | grep -iE '^(HTTP|access-control|content-type|content-encoding|cache-control|content-length|last-modified)'
          curl -sS "${ADRESSE}meta.json" -o meta.json
          echo "== meta.json =="
          jq -c 'to_entries | map(select(.value|type!="array" and type!="object")) | from_entries' meta.json || { echo "meta.json illisible"; exit 1; }
          echo "cles : $(jq -c 'keys' meta.json)"
          echo "== grille.json =="
          curl -sSI -H "Origin: https://exemple.test" "${ADRESSE}grille.json" | grep -iE '^(HTTP|access-control-allow-origin|content-length|content-encoding)'
          curl -sS "${ADRESSE}grille.json" -o grille.json
          echo "mailles (features) : $(jq '.features | length' grille.json)"
          echo "ids (properties.id) : min $(jq '[.features[].properties.id] | min' grille.json), max $(jq '[.features[].properties.id] | max' grille.json), distincts $(jq '[.features[].properties.id] | unique | length' grille.json)"
          echo "type de geometrie : $(jq -r '[.features[].geometry.type] | unique | join(",")' grille.json)"
          echo "== fichiers de couches annonces par meta.json =="
          FICHIERS=$(jq -r '.. | objects | .fichier? // empty' meta.json | sort -u)
          N=0; KO=0
          for f in $FICHIERS; do
            N=$((N+1))
            R=$(curl -sS -o /tmp/f.bin -w "%{http_code} %{size_download}" -H "Origin: https://exemple.test" "${ADRESSE}${f}")
            CODE=${R%% *}
            if [ "$CODE" != "200" ]; then KO=$((KO+1)); echo "ABSENT/ERREUR $f : $R"; else echo "ok $f : $R octets"; fi
          done
          echo "Fichiers listes : $N ; en erreur : $KO"
          echo "== stations.json (facultatif : un jeu publie avant la v2.1 n'en a pas) =="
          CODE_ST=$(curl -sS -o stations.json -w "%{http_code}" -H "Origin: https://exemple.test" "${ADRESSE}stations.json")
          if [ "$CODE_ST" = "200" ]; then
            echo "stations : $(jq '.n_stations' stations.json), annees $(jq '.annees | first' stations.json)-$(jq '.annees | last' stations.json), genere le $(jq -r '.genere_le' stations.json)"
            echo "lignes de la table : $(jq '.stations.id | length' stations.json)"
            NS=0; KOS=0
            # Base precalculee des stations (v2.3) : ses fichiers s'ajoutent a ceux des couches, et
            # son empreinte de reglages doit etre celle de la base des mailles (meta.json).
            echo "base des stations : $(jq '(.base // []) | length' stations.json) fichiers, $(jq '(.base_parametres.vides // []) | length' stations.json) entrees vides (aucune station ne les renseigne)"
            EMP_ST=$(jq -r '.base_parametres.empreinte // ""' stations.json); EMP_MA=$(jq -r '.base_parametres.empreinte // ""' meta.json)
            if [ -n "$EMP_ST" ] && [ -n "$EMP_MA" ] && [ "$EMP_ST" != "$EMP_MA" ]; then
              echo "EMPREINTE DIFFERENTE entre meta.json et stations.json : le mode rapide des stations ne servirait pas"
              KO=$((KO+1))
            fi
            for f in $(jq -r '(.couches[], (.base // [])[]) | .fichier' stations.json | sort -u); do
              NS=$((NS+1))
              R=$(curl -sS -o /tmp/f.bin -w "%{http_code} %{size_download}" -H "Origin: https://exemple.test" "${ADRESSE}${f}")
              CODE=${R%% *}
              if [ "$CODE" != "200" ]; then KOS=$((KOS+1)); echo "ABSENT/ERREUR $f : $R"; else echo "ok $f : $R octets"; fi
            done
            echo "Fichiers de stations listes : $NS ; en erreur : $KOS"
            KO=$((KO+KOS))
          else
            echo "stations.json : HTTP $CODE_ST (jeu sans stations : l'application n'utilise alors que les mailles)"
          fi
          echo "== Page d'accueil et .nojekyll =="
          curl -sS -o /dev/null -w "index.md/index.html : %{http_code}\n" "${ADRESSE}"
          [ "$KO" = "0" ] && [ "$N" -gt 0 ]
